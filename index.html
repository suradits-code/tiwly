<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiwly · ค้นหาติวเตอร์ที่ใช่</title>
<meta name="description" content="แพลตฟอร์มค้นหาและจองเรียนกับติวเตอร์ทั่วประเทศไทย ทั้งออนไลน์และตัวต่อตัว">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar, centered 1240px column, cards on a soft blue-white ground; dashboards use sidebar + content that stack on phones */
:root{
  --bg:#FFFFFF; --bg-soft:#F5F8FF; --page:#F7F9FD; --surface:#FFFFFF; --surface-2:#F1F4FA;
  --ink:#0E1A3A; --ink-2:#2A3654; --muted:#4F5B76; --line:#E2E7F1; --line-2:#D5DFF7; --dot:#D5DFF7;
  --primary:#1E4ED8; --primary-hover:#163BA6; --primary-ink:#FFFFFF; --link:#1E4ED8; --tint:#E8EEFE; --tint-ink:#163BA6;
  --ok-bg:#E6F5EF; --ok:#0B6B53; --warn-bg:#FFF4DB; --warn:#7A4B00; --danger:#B42318; --star:#F2A516; --star-off:#B5BDD0;
  --navy:#0E1A3A; --navy-2:#15244D; --navy-line:#2A3B6E; --on-navy:#FFFFFF; --on-navy-muted:#B9C6E6;
  --av-l:90%; --av-t:30%; --shadow:0 24px 48px -28px rgba(14,26,58,.35); --scrim:rgba(14,26,58,.45); --focus:#7FA2FF;
  --f-display:'Anuphan','IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --bg-soft:#0F1A30; --page:#0B1220; --surface:#111B2E; --surface-2:#18243B;
  --ink:#E7ECF7; --ink-2:#C9D2E6; --muted:#9AA5BF; --line:#22304D; --line-2:#2E4068; --dot:#1E2C4A;
  --primary:#5B86F5; --primary-hover:#7C9FF8; --primary-ink:#07112A; --link:#8FB0FF; --tint:#1A2A52; --tint-ink:#B4C8FF;
  --ok-bg:#0F3328; --ok:#74D9B5; --warn-bg:#3A2B0B; --warn:#F2C467; --danger:#FF8A80; --star:#F5B83A; --star-off:#4A5878;
  --navy:#101D3D; --navy-2:#172650; --navy-line:#2E4174; --on-navy:#FFFFFF; --on-navy-muted:#B9C6E6;
  --av-l:26%; --av-t:86%; --shadow:0 24px 48px -28px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.6); --focus:#8FB0FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --bg-soft:#0F1A30; --page:#0B1220; --surface:#111B2E; --surface-2:#18243B;
  --ink:#E7ECF7; --ink-2:#C9D2E6; --muted:#9AA5BF; --line:#22304D; --line-2:#2E4068; --dot:#1E2C4A;
  --primary:#5B86F5; --primary-hover:#7C9FF8; --primary-ink:#07112A; --link:#8FB0FF; --tint:#1A2A52; --tint-ink:#B4C8FF;
  --ok-bg:#0F3328; --ok:#74D9B5; --warn-bg:#3A2B0B; --warn:#F2C467; --danger:#FF8A80; --star:#F5B83A; --star-off:#4A5878;
  --navy:#101D3D; --navy-2:#172650; --navy-line:#2E4174; --on-navy:#FFFFFF; --on-navy-muted:#B9C6E6;
  --av-l:26%; --av-t:86%; --shadow:0 24px 48px -28px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.6); --focus:#8FB0FF; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--primary-hover)}
button{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* demo strip + top bar */
.demo{background:var(--navy);color:var(--on-navy-muted);font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:center;padding-block:7px;text-align:center}
.demo button{background:none;border:0;color:var(--on-navy);text-decoration:underline;cursor:pointer;font-size:13px;padding:2px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:20px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.logo:hover{color:var(--ink)}
.mainnav{flex:1;display:flex;align-items:center;gap:6px 26px;font-weight:500;font-size:15px}
.mainnav .links{display:flex;gap:6px 24px;flex-wrap:wrap}
.mainnav .links a,.mainnav .links button{color:var(--ink-2);background:none;border:0;padding:8px 0;cursor:pointer;font-weight:500;font-size:15px}
.mainnav .links a[aria-current="page"]{color:var(--link)}
.nav-auth{margin-left:auto;display:flex;gap:8px;align-items:center}
.nav-toggle{display:none;margin-left:auto;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;align-items:center;justify-content:center}
.userchip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:999px;color:var(--ink);font-weight:500}
.userchip:hover{color:var(--ink);border-color:var(--line-2)}
@media (max-width:900px){
  .nav-toggle{display:inline-flex}
  .mainnav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:12px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
  .mainnav.open{display:flex}
  .mainnav .links{flex-direction:column;gap:0}
  .mainnav .links a,.mainnav .links button{padding:12px 0;text-align:left;border-bottom:1px solid var(--line)}
  .nav-auth{margin-left:0;padding-top:12px}
}

/* primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:var(--primary-hover);color:var(--primary-ink)}
.btn-outline{background:var(--surface);border-color:var(--line-2);color:var(--link)}
.btn-outline:hover{border-color:var(--link);color:var(--link)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn-block{width:100%}
.btn-lg{min-height:52px;font-size:17px;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;flex-shrink:0}
.icon-btn[aria-pressed="true"]{color:#E5484D;border-color:#F3B0B2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.pad{padding:24px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap;line-height:1.6}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-neutral{background:var(--surface-2);color:var(--ink-2)}
.b-info{background:var(--tint);color:var(--tint-ink)}
.tag{display:inline-flex;font-size:13px;padding:3px 10px;border-radius:8px;background:var(--bg-soft);border:1px solid var(--line);color:var(--ink-2)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-family:var(--f-display);font-weight:700;flex-shrink:0;background:hsl(var(--h) 80% var(--av-l));color:hsl(var(--h) 55% var(--av-t))}
.eyebrow{font-size:14px;font-weight:600;color:var(--link);letter-spacing:.04em}
.h2{font-weight:700;font-size:clamp(1.7rem,3vw,2.4rem)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px}
.sec-head>div{display:flex;flex-direction:column;gap:8px}
.stars{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--ink)}
.input{font:inherit;font-weight:400;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.input:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
textarea.input{resize:vertical;min-height:88px}
.check{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:400;cursor:pointer;min-height:32px}
.check input{accent-color:var(--primary);width:18px;height:18px;margin:0;flex-shrink:0}
.seg{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;background:transparent;color:var(--ink-2);padding:6px 8px;min-height:38px;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(14,26,58,.15)}
.pill{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 14px;min-height:40px;font-size:14px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.slot{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 4px;min-height:44px;font-size:14px;font-weight:500;cursor:pointer}
.slot[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.slot[disabled]{color:var(--muted);text-decoration:line-through;cursor:not-allowed;background:var(--surface-2)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:10px 12px}
.tbl td{padding:13px 12px;border-top:1px solid var(--line);vertical-align:middle}
.grid-auto{display:grid;gap:20px}
.empty{border:1px dashed var(--line-2);border-radius:16px;padding:24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* home */
.hero{background:var(--bg-soft);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}
.hero-in{position:relative;display:flex;flex-wrap:wrap;gap:48px;align-items:center;padding-block:64px 56px}
.hero h1{font-weight:700;font-size:clamp(2.3rem,5vw,3.9rem);line-height:1.15;letter-spacing:-.02em}
.hero h1 span{color:var(--link)}
.searchbar{flex:1 1 100%;background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:10px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:6px}
.searchbar label{flex:1 1 180px;display:flex;flex-direction:column;gap:2px;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.searchbar label+label{border-left:1px solid var(--line)}
.searchbar input,.searchbar select{border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:2px 0;min-height:30px;width:100%}
.searchbar input:focus,.searchbar select:focus{outline:none}
.searchbar label:focus-within{background:var(--bg-soft)}
.searchbar .btn{flex:1 1 170px;min-height:56px;font-size:17px;border-radius:14px}
@media (max-width:700px){.searchbar label+label{border-left:0;border-top:1px solid var(--line);border-radius:0}}
.hero-visual{flex:1 1 360px;min-width:0;position:relative;min-height:320px}
.subj{display:flex;gap:16px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;width:100%}
.subj:hover{border-color:var(--link)}
.subj .g{display:flex;width:56px;height:56px;border-radius:14px;background:var(--bg-soft);border:1px solid var(--line);align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--link);flex-shrink:0}
.band{background:var(--navy);color:var(--on-navy)}
.band .eyebrow{color:#8FB0FF}

/* tutor card */
.tcard{display:flex;flex-wrap:wrap;gap:20px;padding:22px}
.tcard .side{flex:1 1 210px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;border-left:1px solid var(--line);padding-left:20px}
@media (max-width:640px){.tcard .side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:6px 18px;font-size:14px;color:var(--ink-2)}
.facts span{display:flex;gap:8px;align-items:center}
.facts svg{color:var(--muted);flex-shrink:0}
.fcard{display:flex;flex-direction:column;gap:14px;padding:22px}

/* search layout */
.search-grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.filters{flex:1 1 270px;max-width:100%;padding:6px 20px 14px}
.filters fieldset{border:0;margin:0;padding:16px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.filters fieldset:last-child{border-bottom:0}
.filters legend{font-weight:600;font-size:15px;padding:0;margin-bottom:8px}
.results{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:16px}
.filter-toggle{display:none}
@media (max-width:900px){.filter-toggle{display:inline-flex}.filters.collapsed{display:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--tint-ink);font-size:14px;font-weight:500;padding:4px 6px 4px 14px;border-radius:999px;border:0;cursor:pointer;min-height:34px}

/* profile */
.prof-grid{display:flex;flex-wrap:wrap-reverse;gap:24px;align-items:flex-start}
.prof-main{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:24px}
.book{flex:1 1 340px;min-width:0;padding:24px;display:flex;flex-direction:column;gap:16px;border-color:var(--line-2);box-shadow:var(--shadow)}
@media (min-width:1000px){.book{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}}
.avail{display:grid;grid-template-columns:84px repeat(7,minmax(44px,1fr));gap:6px;min-width:520px;font-size:14px}
.avail .c{height:40px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.avail .c.on{background:var(--primary);border-color:var(--primary)}
.bar{flex:1;height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;display:flex}
.bar span{background:var(--star);border-radius:8px}

/* dashboards */
.dash{display:flex;flex-wrap:wrap;align-items:stretch;background:var(--page);min-height:70vh}
.dash-side{flex:1 1 240px;max-width:100%;background:var(--surface);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:18px}
.dash-side.navy{background:var(--navy);border-right:0;color:var(--on-navy)}
.dash-nav{display:flex;flex-direction:column;gap:2px}
.dash-nav button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;background:transparent;color:var(--ink-2);padding:10px 12px;border-radius:10px;min-height:44px;font-weight:500;font-size:15px;cursor:pointer}
.dash-nav button:hover{background:var(--surface-2)}
.dash-nav button[aria-current="true"]{background:var(--tint);color:var(--tint-ink)}
.navy .dash-nav button{color:var(--on-navy-muted)}
.navy .dash-nav button:hover{background:var(--navy-2)}
.navy .dash-nav button[aria-current="true"]{background:var(--primary);color:var(--primary-ink)}
.dash-main{flex:999 1 640px;min-width:0;padding:28px max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
@media (min-width:700px){.dash-main{padding-left:36px;padding-right:36px}}
@media (max-width:900px){.dash-side{border-right:0;border-bottom:1px solid var(--line)}.dash-nav{flex-direction:row;overflow-x:auto}.dash-nav button{white-space:nowrap}.dash-side .hide-sm{display:none}}
.kpi{padding:20px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:30px;line-height:1.25}
.next{background:var(--navy);color:var(--on-navy);border:0}
.chart{display:flex;align-items:flex-end;gap:clamp(8px,2vw,24px);height:220px;border-bottom:1px solid var(--line);padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart .col i{display:block;width:100%;max-width:56px;border-radius:8px 8px 0 0;background:var(--line-2)}
.chart .col.now i{background:var(--primary)}
.chart-x{display:flex;gap:clamp(8px,2vw,24px);font-size:13px;color:var(--muted)}
.chart-x span{flex:1;text-align:center}
.avail-edit button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.avail-edit button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary)}

/* overlays */
.modal-back{position:fixed;inset:0;background:var(--scrim);z-index:100;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:22px;width:min(560px,100%);max-height:100%;overflow:auto;padding:26px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.modal.wide{width:min(900px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on-navy);padding:12px 18px;border-radius:14px;z-index:120;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--navy);color:var(--on-navy);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tray-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.tray .item{display:inline-flex;align-items:center;gap:8px;background:var(--navy-2);border:1px solid var(--navy-line);border-radius:12px;padding:4px 6px 4px 4px;font-size:14px}
.tray .item button{background:none;border:0;color:var(--on-navy-muted);cursor:pointer;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center}
.tray .btn-tray{background:#FFFFFF;color:#0E1A3A}
footer{border-top:1px solid var(--line);background:var(--surface)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@keyframes rise{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{animation:rise .2s ease-out}
</style>

<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){

/* ---------- SEARCH ---------- */
function filtered(){
 const qq=F.q.trim().toLowerCase();
 return PUB().filter(t=>{
  if(qq&&!((t.name||'').toLowerCase().includes(qq)||(t.nick||'').toLowerCase().includes(qq)||(t.subjects||[]).some(s=>s.includes(F.q.trim()))||(t.headline||'').toLowerCase().includes(qq)))return false;
  if(F.subjects.length&&!F.subjects.some(s=>(t.subjects||[]).includes(s)))return false;
  if(F.level&&!(t.levels||[]).includes(F.level))return false;
  if(F.min!==''&&t.price<Number(F.min))return false;
  if(F.max!==''&&t.price>Number(F.max))return false;
  if(F.province&&t.province!==F.province&&!((t.modes||[]).includes('online')&&F.mode!=='onsite'))return false;
  if(F.mode!=='all'&&!(t.modes||[]).includes(F.mode))return false;
  if(t.exp<F.exp)return false;
  if(F.rating&&rating(t)<F.rating)return false;
  return true}).sort({rec:(a,b)=>(b.verified-a.verified)||(rating(b)*Math.log(b.rating_count+2)-rating(a)*Math.log(a.rating_count+2)),rating:(a,b)=>rating(b)-rating(a)||b.rating_count-a.rating_count,priceAsc:(a,b)=>a.price-b.price,priceDesc:(a,b)=>b.price-a.price,exp:(a,b)=>b.exp-a.exp,new:(a,b)=>String(b.created_at).localeCompare(String(a.created_at))}[F.sort]);
}

function fitJpeg(file,max){
 return new Promise((resolve,reject)=>{
  if(!/^image\//.test(file.type||''))return reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพ'));
  if(file.size>25*1024*1024)return reject(new Error('รูปใหญ่เกิน 25 MB'));
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);c.toBlob(b=>b?resolve({blob:b,w,h}):reject(new Error('แปลงรูปไม่สำเร็จ')),'image/jpeg',0.84)};
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('เปิดไฟล์รูปนี้ไม่ได้ ลองใช้ไฟล์ JPG หรือ PNG'))};
  img.src=url;
 });
}
async function addGalleryImage(file,category,caption){

 const path=`${uid()}/gallery-${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
 const up=await sb.storage.from('tutor-photos').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(up.error)throw up.error;
 const url=sb.storage.from('tutor-photos').getPublicUrl(path).data.publicUrl;
 const {error}=await sb.from('tutor_gallery').insert({tutor_id:uid(),url,caption,category:CATS[category]?category:'other',width:w,height:h,sort:(GAL[uid()]||[]).length});
 if(error){await sb.storage.from('tutor-photos').remove([path]);throw error}
}

/* ---------- AUTH GATE ---------- */

 const isT=kind==='tutor';
 return `<div class="wrap" style="padding-block:80px"><div class="card" style="max-width:560px;margin:0 auto;padding:32px;display:flex;flex-direction:column;gap:14px;align-items:flex-start">

<h1 style="font-size:26px;font-weight:700">${isT?'แดชบอร์ดสำหรับติวเตอร์':'เข้าสู่ระบบเพื่อดูแดชบอร์ด'}</h1>
<p class="muted">${isT?'จัดการคำขอจอง ตารางสอน ข้อความ และการยืนยันตัวตนได้ในที่เดียว':'ดูการจอง ข้อความกับติวเตอร์ ติวเตอร์ที่บันทึกไว้ และให้คะแนนหลังเรียน'}</p>

</div></div>`;

/* ---------- MESSAGES (shared) ---------- */
function threadsView(msgs,side){
 /* side: 'parent' groups by tutor_id ; 'tutor' groups by parent_id */
 if(!msgs)return loadingBox();
 if(msgs.error)return errBox(msgs.error);
 if(!msgs.length)return `<div class="empty">${side==='parent'?'ยังไม่มีข้อความ กด “ส่งข้อความสอบถาม” ในหน้าโปรไฟล์ติวเตอร์':'ยังไม่มีข้อความจากผู้ปกครอง'}</div>`;
 const groups={};msgs.forEach(m=>{const k=side==='parent'?m.tutor_id:m.parent_id;(groups[k]=groups[k]||[]).push(m)});
 return Object.entries(groups).sort((a,b)=>String(b[1][b[1].length-1].created_at).localeCompare(String(a[1][a[1].length-1].created_at))).map(([k,list])=>{
  const t=side==='parent'?tutor(k):null;
  const other=side==='parent'?(t?t.name:'ติวเตอร์'):((list.find(m=>m.sender_id===k)||{}).sender_name||'ผู้ปกครอง');
  const tutorId=list[0].tutor_id,parentId=list[0].parent_id;
  return `<div style="border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px">
<b style="font-weight:600">${side==='parent'?'คุยกับ ':'จาก '}${esc(other)}</b>
<div style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto">${list.map(m=>{const mine=m.sender_id===uid();return `<div style="align-self:${mine?'flex-end':'flex-start'};max-width:85%;background:${mine?'var(--tint)':'var(--surface-2)'};color:var(--ink);border-radius:14px;padding:8px 12px"><div style="white-space:pre-line">${esc(m.body)}</div><div class="muted" style="font-size:12px">${mine?'คุณ':esc(m.sender_name||'')} · ${fmtDT(m.created_at)}</div></div>`}).join('')}</div>
<form data-form="reply" data-tutor="${tutorId}" data-parent="${parentId}" style="display:flex;gap:8px"><label class="sr" for="rp-${k}">ตอบกลับ</label><input class="input" id="rp-${k}" name="body" placeholder="พิมพ์ข้อความ…" autocomplete="off"><button class="btn btn-primary" type="submit">ส่ง</button></form></div>`}).join('');
}

/* ---------- STUDENT DASHBOARD ---------- */
const STATUS={pending:['รอติวเตอร์ยืนยัน','b-warn'],confirmed:['ยืนยันแล้ว','b-ok'],done:['เรียนเสร็จแล้ว','b-info'],reviewed:['รีวิวแล้ว','b-neutral'],cancelled:['ยกเลิกแล้ว','b-neutral'],declined:['ติวเตอร์ไม่สะดวก','b-neutral']};
const stBadge=s=>`<span class="badge ${(STATUS[s]||['',''])[1]}">${(STATUS[s]||[s])[0]}</span>`;
function viewStudent(){
 if(!uid())return loginGate('parent');
 const bk=need('sbook',()=>q(sb.from('bookings').select('*').eq('parent_id',uid()).order('day',{ascending:false})));
 const msgs=need('smsg',()=>q(sb.from('messages').select('*').eq('parent_id',uid()).order('created_at')));
 const studs=need('students',()=>q(sb.from('students').select('*').eq('parent_id',uid()).order('created_at')));
 const mine=Array.isArray(bk)?bk:[];
 const today=todayISO();
 const upcoming=mine.filter(b=>['confirmed','pending'].includes(b.status)&&b.day>=today).sort((a,b)=>(a.day+a.start_time).localeCompare(b.day+b.start_time));
 const next=upcoming.find(b=>b.status==='confirmed');
 const toRate=mine.filter(b=>b.status==='done');
 let list=mine.slice();
 if(studentTab==='upcoming')list=upcoming;

 const tn=id=>tutor(id)||{name:'ติวเตอร์',hue:220};
 const nextCard=!bk?loadingBox():next?(()=>{const t=tn(next.tutor_id);return `<section class="card next pad" style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px;color:var(--on-navy-muted)">คาบเรียนถัดไป</span><span class="badge" style="background:#E6F5EF;color:#0B6B53">ยืนยันแล้ว</span></div>
<div style="display:flex;gap:14px;align-items:center">${av(t,52,22,14)}<div style="display:flex;flex-direction:column;line-height:1.35"><b style="font-family:var(--f-display);font-weight:600;font-size:19px">${esc(next.subject)}${next.student?' · '+esc(next.student):''}</b><span style="color:var(--on-navy-muted);font-size:14px">กับ ${esc(t.name)}</span></div></div>

<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" style="background:#fff;color:#0E1A3A" data-act="message" data-id="${next.tutor_id}">${I.chat()} ส่งข้อความ</button><a class="btn" style="border-color:var(--navy-line);color:#fff" href="#t-${next.tutor_id}">ดูโปรไฟล์ติวเตอร์</a></div></section>`})():`<section class="card pad empty" style="justify-content:center"><b style="color:var(--ink);font-size:17px">ยังไม่มีคาบเรียนที่ยืนยันแล้ว</b><span>${upcoming.length?'คำขอของคุณกำลังรอติวเตอร์ยืนยัน':'ค้นหาติวเตอร์แล้วส่งคำขอจองได้เลย'}</span><a class="btn btn-primary" href="#search">ค้นหาติวเตอร์</a></section>`;
 const rateCards=toRate.map(b=>{const t=tn(b.tutor_id);const sc=rateDraft[b.id]||0;return `<section class="card pad" style="display:flex;flex-direction:column;gap:12px"><span class="muted" style="font-size:14px">ให้คะแนนหลังเรียน</span><b style="font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.35">คาบ${esc(b.subject)}กับ${esc(nick(t))} เมื่อ ${fmtDate(b.day)} เป็นอย่างไรบ้าง?</b>
<div role="group" aria-label="ให้คะแนน" style="display:flex;gap:6px">${[1,2,3,4,5].map(n=>`<button class="icon-btn" data-act="rateStar" data-id="${b.id}" data-v="${n}" aria-label="${n} ดาว">${I.star(24,n<=sc)}</button>`).join('')}</div>
<label class="field" for="rv-${b.id}">เล่าประสบการณ์สั้น ๆ<textarea class="input" id="rv-${b.id}" rows="2" maxlength="1000" placeholder="เช่น อธิบายเข้าใจง่าย ตรงเวลา"></textarea></label>
<p id="rverr-${b.id}" style="color:var(--danger);font-size:14px" hidden>เลือกจำนวนดาวก่อนส่งรีวิว</p>
<button class="btn btn-primary" style="align-self:flex-start" data-act="submitReview" data-id="${b.id}">ส่งรีวิว</button></section>`}).join('');
 const rows=list.map(b=>{const t=tn(b.tutor_id);let act='';

  else if(b.status==='done')act=`<button class="btn btn-primary btn-sm" data-act="stuSec" data-v="overview">ให้คะแนน</button>`;

 const cmpT=L.compare.map(tutor).filter(Boolean);

 return `<div class="dash">

 ['ราคาออนไลน์/ชม.',list.map((t,i)=>((t.modes||[]).includes('online')?baht(t.price):'–')+(pb[i]?' <span class="badge b-ok">ถูกที่สุด</span>':''))],
 ['ราคาตัวต่อตัว/ชม.',list.map(t=>(t.modes||[]).includes('onsite')?baht(t.price_onsite):'–')],

/* ---------- PromptPay QR + ค่าธรรมเนียม ---------- */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amount){
 const f=(tag,val)=>tag+String(val.length).padStart(2,'0')+val;
 let n=String(id||'').replace(/[^0-9]/g,'');if(!n)return '';
 const acc=n.length>=13?f('02',n):f('01',('0000000000000'+n.replace(/^0/,'66')).slice(-13));
 const p=f('00','01')+f('01',amount?'12':'11')+f('29',f('00','A000000677010111')+acc)+f('53','764')+(amount?f('54',Number(amount).toFixed(2)):'')+f('58','TH')+'6304';
 return p+crc16(p);
}
function qrSvg(text){try{if(!window.qrcode||!text)return '';const q=window.qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:5,margin:3,scalable:true})}catch(e){return ''}}
function settingsMap(){return need('settings',async()=>{const d=await q(sb.from('settings').select('*'));const o={};(d||[]).forEach(r=>{o[r.key]=r.value});return o})}
const FEE_ST={due:['รอชำระ','b-warn'],submitted:['ส่งสลิปแล้ว รอตรวจสอบ','b-info'],paid:['ชำระแล้ว','b-ok'],waived:['ยกเว้น','b-neutral']};
const feeBadge=s=>`<span class="badge ${(FEE_ST[s]||['',''])[1]}">${(FEE_ST[s]||[s])[0]}</span>`;
function feeRules(days){return `ค่าธรรมเนียมแพลตฟอร์มเก็บครั้งเดียวต่อผู้เรียนใหม่ 1 ราย (1 บัญชีผู้ปกครอง) เท่ากับค่าเรียนเต็มของคาบแรกที่สอนเสร็จ หากคาบแรกเป็นคาบทดลองเรียนฟรีจากโค้ด ผู้เรียนไม่เสียค่าเรียน แต่ค่าธรรมเนียมคิดตามราคาปกติของคาบนั้น ชำระภายใน ${days||7} วันหลังสอนเสร็จ หากค้างเกินกำหนดจะกดตอบรับคำขอใหม่ไม่ได้จนกว่าจะชำระ`}
function feesView(comm,dueList,dueTotal,overdue){
 if(!comm)return loadingBox();

function readTutorForm(fd){

 return {name:(fd.get('name')||'').trim(),nick:(fd.get('nick')||'').trim(),headline:(fd.get('headline')||'').trim(),bio:(fd.get('bio')||'').trim(),uni:(fd.get('uni')||'').trim(),faculty:(fd.get('faculty')||'').trim(),edu_status:fd.get('edu_status')||'',exp:Math.max(0,Math.min(60,Number(fd.get('exp'))||0)),experience:(fd.get('experience')||'').trim(),subjects:fd.getAll('subj'),levels:fd.getAll('lvl'),price,price_onsite:Number(fd.get('price_onsite'))||price,province:fd.get('province')||'',areas:(fd.get('areas')||'').trim(),modes,accept_trial:!!fd.get('accept_trial'),avail:joinAvail.map(r=>r.slice())};
}
function validateTutor(r){
 const e=[];if(r.name.length<2)e.push('กรอกชื่อ–นามสกุล');if(!r.uni)e.push('กรอกมหาวิทยาลัย');if(!r.subjects.length)e.push('เลือกวิชาที่สอนอย่างน้อย 1 วิชา');if(!r.levels.length)e.push('เลือกระดับชั้นที่สอนอย่างน้อย 1 ระดับ');if(!(r.price>=50&&r.price<=20000))e.push('ราคาออนไลน์ต้องอยู่ระหว่าง ฿50–฿20,000');if(!(r.price_onsite>=50&&r.price_onsite<=20000))e.push('ราคาตัวต่อตัวต้องอยู่ระหว่าง ฿50–฿20,000');if(!r.modes.length)e.push('เลือกรูปแบบการสอนอย่างน้อย 1 แบบ');if(!r.avail.flat().some(Boolean))e.push('เลือกเวลาว่างอย่างน้อย 1 ช่อง');if(r.bio.length<50)e.push('เขียนประวัติและแนะนำตัวอย่างน้อย 50 ตัวอักษร (ตอนนี้ '+r.bio.length+' ตัว)');return e;

async function uploadDoc(kind,file){
 if(!file||!file.name)return false;
 if(file.size>10*1024*1024)throw new Error('ไฟล์ใหญ่เกิน 10 MB');
 const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
 const path=`${uid()}/${kind}-${Date.now()}.${ext}`;
 const {error}=await sb.storage.from('tutor-docs').upload(path,file,{contentType:file.type||undefined});
 if(error)throw error;
 return true;
}
/* ย่อและครอปรูปเป็น 512x512 JPEG ก่อนอัปโหลด */
function squareJpeg(file){
 return new Promise((resolve,reject)=>{
  if(!/^image\//.test(file.type||''))return reject(new Error('กรุณาเลือกไฟล์รูปภาพ'));
  if(file.size>15*1024*1024)return reject(new Error('รูปใหญ่เกิน 15 MB'));
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const s=Math.min(img.naturalWidth,img.naturalHeight);const c=document.createElement('canvas');c.width=c.height=512;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,512,512);ctx.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,512,512);URL.revokeObjectURL(url);c.toBlob(b=>b?resolve(b):reject(new Error('แปลงรูปไม่สำเร็จ')),'image/jpeg',0.86)};
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('เปิดไฟล์รูปนี้ไม่ได้ ลองใช้ไฟล์ JPG หรือ PNG'))};
  img.src=url;
 });
}
async function uploadPhoto(file){
 const blob=await squareJpeg(file);
 const path=`${uid()}/avatar-${Date.now()}.jpg`;
 const {error}=await sb.storage.from('tutor-photos').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
 if(error)throw error;
 return sb.storage.from('tutor-photos').getPublicUrl(path).data.publicUrl;
}

function viewSetup(){return `<div class="wrap" style="padding-block:80px"><div class="card pad" style="max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px"><h1 style="font-size:24px;font-weight:700">ยังเชื่อมต่อฐานข้อมูลไม่ได้</h1><p class="muted">ไม่สามารถโหลดไลบรารี Supabase ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้า</p></div></div>`}
function render(){
 const r=route();
 if(!sb){$('#app').innerHTML=viewSetup();return}
 let body='';
 if(r==='home')body=viewHome();
 else if(r==='search')body=viewSearch();
 else if(/^t-[0-9a-f-]{36}$/.test(r))body=viewProfile(r.slice(2));
 else if(r==='student')body=viewStudent();
 else if(r==='tutor-dashboard')body=viewTutorDash();
 else if(r==='join')body=viewJoin();
 else if(r==='admin')body=viewAdmin();
 else if(r==='privacy')body=viewPrivacy();
 else body=viewHome();
 $('#app').innerHTML=header()+`<main id="main">${body}</main>`+(['student','tutor-dashboard'].includes(r)?'':footer());
 if(r==='search')renderResults();
 tray();
 if(scrollToBook){scrollToBook=false;const b=$('#book');if(b)setTimeout(()=>b.scrollIntoView({behavior:'smooth',block:'start'}),40)}
}
function rerenderKeep(){
 /* อย่า render ทับขณะผู้ใช้กำลังพิมพ์ในฟอร์มยาว */
 const a=document.activeElement;
 const typing=a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['checkbox','radio','file','button','submit'].includes(a.type)))&&a.closest('form[data-form="join"],form[data-form="tutorEdit"]');
 if(typing)return;
 const y=window.scrollY;render();window.scrollTo(0,y);
}

  const have=(GAL[uid()]||[]).length;if(have+files.length>12){toast('อัปโหลดได้รวมสูงสุด 12 รูป (เหลืออีก '+(12-have)+' รูป)',true);return}
  busy(btn,true,'กำลังอัปโหลด 0/'+files.length);let ok=0;
  for(const f of files){try{await addGalleryImage(f,fd.get('category')||'other',(fd.get('caption')||'').trim());ok++;btn.textContent='กำลังอัปโหลด '+ok+'/'+files.length}catch(x){toast(f.name+': '+errMsg(x),true)}}
  busy(btn,false);await loadGallery();rerenderKeep();if(ok)toast('อัปโหลดแล้ว '+ok+' รูป');return}
 if(kind==='promo'){const code=String(fd.get('code')||'').trim().toUpperCase();const err=$('#pc-err');err.hidden=true;
  if(!/^[A-Z0-9_-]{3,30}$/.test(code)){err.textContent='โค้ดต้องเป็นตัวอักษรภาษาอังกฤษหรือตัวเลข 3–30 ตัว';err.hidden=false;return}
  const mx=fd.get('max_uses'),ex=fd.get('expires_at');busy(btn,true);
  const {error}=await sb.from('promo_codes').insert({code,description:(fd.get('description')||'').trim(),max_uses:mx?Number(mx):null,expires_at:ex||null});busy(btn,false);
  if(error){err.textContent=/duplicate/i.test(error.message)?'มีโค้ดนี้อยู่แล้ว':errMsg(error);err.hidden=false;return}
  invalidate('codes');rerenderKeep();toast('สร้างโค้ด '+code+' แล้ว');return}
 if(kind==='settings'){busy(btn,true);const rows=['promptpay_id','promptpay_name','fee_due_days'].map(k=>({key:k,value:String(fd.get(k)||'').trim()}));
  rows[0].value=rows[0].value.replace(/[^0-9]/g,'');
  const {error}=await sb.from('settings').upsert(rows);busy(btn,false);if(error){toast(errMsg(error),true);return}invalidate('settings');rerenderKeep();toast('บันทึกการตั้งค่าแล้ว');return}
 if(kind==='student'){const name=(fd.get('name')||'').trim();if(!name){$('#st-name').focus();return}busy(btn,true);const {error}=await sb.from('students').insert({parent_id:uid(),name,level:fd.get('level'),goal:(fd.get('goal')||'').trim()});busy(btn,false);if(error){toast(errMsg(error),true);return}invalidate('students');rerenderKeep();toast('เพิ่มโปรไฟล์ '+name+' แล้ว');return}
 if(kind==='tutorEdit'){const r=readTutorForm(fd);const errs=validateTutor(r);showErrs(errs);if(errs.length)return;busy(btn,true,'กำลังบันทึก…');
  const ph=fd.get('photo');if(ph&&ph.name){try{r.photo_url=await uploadPhoto(ph)}catch(x){busy(btn,false);showErrs(['อัปโหลดรูปไม่สำเร็จ: '+errMsg(x)]);return}}else if(fd.get('removePhoto')||!(myTutor&&myTutor.photo_url)){busy(btn,false);showErrs(['ต้องมีรูปโปรไฟล์ กรุณาเลือกรูป']);return}
  const {data,error}=await sb.from('tutors').update(r).eq('id',uid()).select().single();busy(btn,false);if(error){showErrs([errMsg(error)]);return}myTutor=data;B=null;await loadTutors();toast('บันทึกโปรไฟล์แล้ว');tutorTab='overview';rerenderKeep();return}
 if(kind==='join'){
  const r=readTutorForm(fd);const errs=validateTutor(r);
  if(!uid()){const em=(fd.get('email')||'').trim(),pw=fd.get('pass')||'';if(!em)errs.unshift('กรอกอีเมล');if(pw.length<6)errs.unshift('ตั้งรหัสผ่านอย่างน้อย 6 ตัวอักษร')}
  if(!fd.get('agree'))errs.push('ยืนยันความถูกต้องของข้อมูลและยอมรับเงื่อนไขค่าธรรมเนียมและนโยบายความเป็นส่วนตัว');
  {const ph=fd.get('photo');if(!(ph&&ph.name))errs.unshift('เลือกรูปโปรไฟล์');}
  showErrs(errs);if(errs.length)return;
  busy(btn,true,'กำลังส่งใบสมัคร…');
  try{
   if(!uid()){
    const em=(fd.get('email')||'').trim();
    const res=await sb.auth.signUp({email:em,password:fd.get('pass'),options:{data:{role:'tutor',display_name:r.nick||r.name},emailRedirectTo:location.origin+location.pathname+'#tutor-dashboard'}});
    if(res.error)throw res.error;
    if(!res.data.session){
     try{localStorage.setItem(DRAFT,JSON.stringify({email:em,row:Object.assign({},r,{hue:Math.floor(Math.random()*360)})}))}catch(x){}
     busy(btn,false);const ok=$('#j-ok');ok.innerHTML='<b>เกือบเสร็จแล้ว</b><br>เราส่งลิงก์ยืนยันไปที่ <b>'+esc(em)+'</b> กดลิงก์ในอีเมล แล้วเข้าสู่ระบบด้วยเบราว์เซอร์นี้ ระบบจะสร้างโปรไฟล์จากข้อมูลที่กรอกให้อัตโนมัติ (เอกสารยืนยันตัวตนอัปโหลดได้ในแดชบอร์ดภายหลัง)';ok.hidden=false;ok.scrollIntoView({behavior:'smooth',block:'center'});return}
    session=res.data.session;
   }
   if(me&&me.role!=='tutor')await sb.from('profiles').update({role:'tutor'}).eq('id',uid());
   const ph=fd.get('photo');if(ph&&ph.name){try{r.photo_url=await uploadPhoto(ph)}catch(x){toast('อัปโหลดรูปโปรไฟล์ไม่สำเร็จ: '+errMsg(x)+' (เพิ่มภายหลังได้ในแดชบอร์ด)',true)}}
   const {data,error}=await sb.from('tutors').insert(tutorRow(r)).select().single();
   if(error)throw error;myTutor=data;
   const gf=fd.getAll('gfiles').filter(f=>f&&f.name).slice(0,12);for(const f of gf){try{await addGalleryImage(f,'other','')}catch(x){toast('อัปโหลดรูปผลงานบางรูปไม่สำเร็จ: '+errMsg(x),true)}}
   const kinds=[];for(const k of ['id','edu','cert']){const file=fd.get('doc-'+k);if(file&&file.name){try{if(await uploadDoc(k,file))kinds.push(k)}catch(x){toast('อัปโหลด '+k+' ไม่สำเร็จ: '+errMsg(x),true)}}}
   await markDocs(kinds);
   await loadMe();await loadTutors();busy(btn,false);tutorTab='overview';toast('ส่งใบสมัครแล้ว รอแอดมินอนุมัติ');go('tutor-dashboard');
  }catch(err){busy(btn,false);showErrs([errMsg(err)])}
  return}
});

/* ---------- boot ---------- */
function showNewPass(){
 if($('#np-form'))return;
 openModal(`${mhead('ตั้งรหัสผ่านใหม่')}<p class="muted">${session&&session.user?'สำหรับบัญชี '+esc(session.user.email):''}</p><form id="np-form" data-form="newpass" style="display:flex;flex-direction:column;gap:12px">${pwField('np','pass','รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)','new-password')}${pwField('np2','pass2','พิมพ์รหัสผ่านใหม่อีกครั้ง','new-password')}<p id="np-err" style="color:var(--danger);font-size:14px" hidden></p><button class="btn btn-primary btn-lg" type="submit">บันทึกรหัสผ่านใหม่</button></form>`);
}
async function boot(){
 if(!sb){render();return}
 /* ลงทะเบียนก่อน เพื่อไม่ให้พลาดเหตุการณ์ PASSWORD_RECOVERY จากลิงก์ในอีเมล */
 sb.auth.onAuthStateChange((ev,s)=>{
  setTimeout(async()=>{
   if(ev==='PASSWORD_RECOVERY'){session=s;showNewPass();return}
   if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'){const changed=(s&&s.user&&s.user.id)!==uid();session=s;if(changed||ev==='SIGNED_OUT'){Object.keys(cache).forEach(k=>delete cache[k]);B=null;await loadMe();render()}}
   else if(ev==='TOKEN_REFRESHED'||ev==='USER_UPDATED'){session=s}
  },0);
 });
 render();
 const {data}=await sb.auth.getSession();session=data.session;
 await Promise.all([loadMe(),loadTutors()]);
 if(/access_token|error_description|type=/.test(location.hash)){try{history.replaceState(null,'',location.pathname+location.search.replace(/[?&](code|error|error_code|error_description)=[^&]*/g,'')+'#home')}catch(e){}}
 render();
 if(IS_RECOVERY){if(session)showNewPass();else{toast('ลิงก์ตั้งรหัสผ่านหมดอายุหรือถูกใช้ไปแล้ว กรุณาขอลิงก์ใหม่',true);openAuth('forgot')}}
 else if(AUTH_ERR){toast(/expired|otp/i.test(AUTH_ERR)?'ลิงก์หมดอายุหรือถูกใช้ไปแล้ว กรุณาขอลิงก์ใหม่':'เกิดข้อผิดพลาดจากลิงก์: '+AUTH_ERR,true)}
}
boot();
})();

</script>
